name: Build signed APT archive (no deployment)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Debian archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aptly gnupg dpkg-dev

      - name: Test release collection logic
        run: python3 -m unittest discover -s tests -v

      - name: Collect approved Netavark Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/collect.py --output .artifacts/packages \
            --lock archive-lock.json \
            --candidate-lock .artifacts/archive-lock.candidate.json

      - name: Build signed APT archive using temporary test-only GPG key
        run: bash scripts/build.sh .artifacts/packages .artifacts/site

      - name: Verify packages, signatures, and APT metadata
        run: python3 scripts/verify.py --site .artifacts/site --packages .artifacts/packages

      - name: Confirm no private signing material in site
        run: |
          set -euo pipefail
          ! grep -R -l --include='*.asc' --include='*.txt' --include='*.html' \
            'BEGIN PGP PRIVATE KEY BLOCK' .artifacts/site

      - name: Archive complete static site
        run: |
          set -euo pipefail
          tar -C .artifacts/site -czf .artifacts/apt-site.tar.gz .
          sha256sum .artifacts/apt-site.tar.gz > .artifacts/apt-site.tar.gz.sha256

      - name: Upload output (not publicly deployed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apt-site
          path: |
            .artifacts/apt-site.tar.gz
            .artifacts/apt-site.tar.gz.sha256
            .artifacts/archive-lock.candidate.json
          if-no-files-found: error
          retention-days: 7
